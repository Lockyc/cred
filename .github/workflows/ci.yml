name: ci
on:
  # Release-time only, never per push: the v* tag, since every commit lands on
  # main. `just gate` is the local check; `gh workflow run ci.yml` runs this on demand.
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go mod tidy && git diff --exit-code go.mod go.sum
